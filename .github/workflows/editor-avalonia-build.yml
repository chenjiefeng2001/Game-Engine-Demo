name: Avalonia Editor Build

# 独立于 Advanced C++ CI（那个 workflow 的 paths 过滤器虽然包含 **/*.axaml，
# 却从不执行 dotnet —— 于是 XAML 改动会触发构建，却没有任何东西编译它）。
#
# 本 workflow 存在的原因：Avalonia 的 XAML 是**编译期**产物。未被编译过的
# XAML 不会因为任何错误而失败，只有真正跑过 Avalonia 的 XAML 编译任务，
# 才会报出「未知属性 / 类型不匹配 / 绑定路径写法错误」这类问题。
# 在此之前，本仓库的 Avalonia UI 改动只有静态检查兜底，没有编译证据。
#
# 本 job 只编译托管侧。原生 EditorBridge.dll 的 staging 由 csproj 里的
# Condition="Exists(...)" 守卫，干净 runner 上会跳过而不失败 —— 那正是这里
# 想要的：我们要的是 XAML 编译证据，不是完整可分发产物。

on:
  push:
    branches: [ "master", "avalonia", "avalonia-p7" ]
    paths:
      - 'editor_avalonia/**'
      - '.github/workflows/editor-avalonia-build.yml'
  pull_request:
    paths:
      - 'editor_avalonia/**'
      - '.github/workflows/editor-avalonia-build.yml'
  workflow_dispatch:

jobs:
  avalonia-editor-build:
    # WinExe + P/Invoke 到 EditorBridge.dll，宿主平台就是 Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # GitHub runner 默认的 nuget.org 是启用的，本仓库不需要额外配置源。
      - name: Restore
        run: |
          dotnet restore editor_avalonia/AvaloniaEditor.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -v:normal 让 Avalonia 的 XAML 编译任务出现在日志里，便于确认它真的跑了，
      # 而不是因为「没找到 XAML」而空转通过。Tee 到 build.log 供下一步断言使用。
      - name: Build (compiles Avalonia XAML)
        shell: pwsh
        run: |
          dotnet build editor_avalonia/AvaloniaEditor.csproj `
            --no-restore --configuration Release --verbosity normal `
            2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # XAML 编译证据 —— 刻意不接受「退出码 0」作为证据。
      #
      # 证据一：产物必须存在且体量合理。一个空壳工程同样会 build 成功，
      #         而含编译后 XAML IL 的程序集在 300KB 量级。
      # 证据二：normal 详细度下，csc 命令行里会出现
      #         /additionalfile:App.axaml /additionalfile:MainWindow.axaml，
      #         证明 XAML 确实作为编译输入参与了本次构建。
      #
      # 证据三（最重要，已实测）：本 job 的校验能力经否定对照证明。
      #   2026-10-18 在布局 Grid 上注入 NotARealAvaloniaProperty="1"，
      #   构建随即失败并给出：
      #     Avalonia error AVLN2000: Unable to resolve suitable regular or
      #     attached property ... on type Avalonia.Controls:Avalonia.Controls.Grid
      #   AVLN 是 Avalonia XAML 编译器的错误码族。它证明该任务真的在执行、
      #   且按真实 Avalonia 类型校验属性 —— 因此一次绿色结果确实意味着
      #   GridSplitter / ResizeDirection / ResizeBehavior / RowDefinition /
      #   ToggleButton / ComboBox 与全部绑定都被 XAML 编译器接受过，
      #   而不是「没找到 XAML 所以空转通过」。
      - name: Assert the XAML compiler actually ran
        shell: pwsh
        run: |
          $assembly = 'editor_avalonia/bin/Release/net9.0/AvaloniaEditor.dll'
          if (-not (Test-Path $assembly)) {
            throw "编译产物不存在: $assembly —— 构建虽返回 0，但没有产出程序集"
          }
          $len = (Get-Item $assembly).Length
          Write-Host "编译产物: $assembly ($len bytes)"
          if ($len -lt 20000) {
            throw "程序集偏小 ($len bytes)，可能未编译 XAML"
          }

          $log = Get-Content build.log -Raw -ErrorAction SilentlyContinue
          if (-not $log) {
            throw "未生成 build.log，无法证明 XAML 参与了编译"
          }
          # csc 命令行中的 XAML 输入标记
          if ($log -match 'additionalfile:\s*\S*MainWindow\.axaml') {
            Write-Host '✅ 编译器命令行包含 MainWindow.axaml —— XAML 确实参与了本次构建'
          } else {
            throw '构建日志中找不到 MainWindow.axaml 的编译输入标记，无法证明 XAML 被编译'
          }
          exit 0
