name: Advanced C++ CI

on:
  push:
    branches: [ "master" ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.cc'
      - '**.cxx'
      - 'CMakeLists.txt'
      - '**.cmake'
      - '**/*.cs'
      - '**/*.axaml'
      - '**/*.csproj'
      - 'third_party/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ "master" ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - 'CMakeLists.txt'
      - '**.cmake'
      - '**/*.cs'
      - '**/*.axaml'
      - '**/*.csproj'
      - 'third_party/**'

  workflow_dispatch:

# ── 自动创建 Release 的权限 ──
permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        # ASan 默认关闭；仅下面新增的 Windows/RelWithDebInfo 组合开启。
        enable_asan: ['OFF']
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          # B5-RD：新增独立组合 Windows + RelWithDebInfo + ASan。
          # 该缺陷的触发条件是"消费侧对象带 ASan 注解 + 参与链接的静态库不带
          # ASan 注解"同时成立。此前 CI 从未启用 ASan（ENABLE_ASAN 默认 OFF），
          # 因此对这个配置空间**完全没有覆盖**——既无法捕获该缺陷，也不能据此
          # 排除其它工具链上是否存在等价问题。
          # 刻意不扩 macOS，也不扩 Linux/Clang 的 ASan 组合。
          - os: windows-latest
            build_type: RelWithDebInfo
            c_compiler: cl
            cpp_compiler: cl
            enable_asan: 'ON'
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libgl1-mesa-dev libgl1-mesa-dri libwayland-dev wayland-protocols \
          libxkbcommon-dev xvfb pkg-config

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

# ── 环境诊断（§8.9 归因用；非功能性，不改变任何门控）──────────────────
    # 目的：把"CI 失败归因于哪一层"从推断变成可审计证据。
    #  1) cmake / 默认生成器 —— 记录 runner 镜像实际提供的工具链
    #  2) Windows：VS 实例是否可被 cmake 发现 —— 区分"脚本选错生成器"与
    #     "runner 镜像找不到 VS"（前者归因于脚本，后者归因于环境）
    - name: Environment diagnostic (non-fatal)
      continue-on-error: true
      shell: pwsh
      run: |
        # pwsh 7.5 起 $PSNativeCommandUseErrorActionPreference 默认为 $true，
        # 原生命令非零退出会抛异常；而 GitHub 的 pwsh shell 又预置
        # $ErrorActionPreference='stop'。两者叠加会让"非致命诊断"直接终止 job
        # —— 这正是上一轮诊断步骤在 Windows 上失败的原因。此处显式关闭。
        $ErrorActionPreference = 'Continue'
        $PSNativeCommandUseErrorActionPreference = $false
        Write-Host "== cmake =="
        (cmake --version) | Select-Object -First 1 | ForEach-Object { Write-Host "  $_" }
        Write-Host "== default generator =="
        cmake -E capabilities 2>$null | Select-String -Pattern '^\s*generators' | Select-Object -First 1
        try { Write-Host "  $((cmake --help | Select-String -Pattern 'Visual Studio|Ninja' | Select-Object -First 3 | Out-String).Trim())" } catch {}

        if ("${{ runner.os }}" -eq 'Windows') {
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "== vswhere =="
          Write-Host "  path exists: $(Test-Path $vswhere)"
          if (Test-Path $vswhere) {
            (& $vswhere -products * -latest -property installationPath) | ForEach-Object { Write-Host "  instance: $_" }
          }
          Write-Host "== trivial VS-generator configure probe =="
          $probe = Join-Path $env:RUNNER_TEMP 'vsprobe'
          Remove-Item -Recurse -Force $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          "cmake_minimum_required(VERSION 3.20)`nproject(vsprobe C)" |
            Set-Content -Path (Join-Path $probe 'CMakeLists.txt') -Encoding utf8
          & cmake -S $probe -B "$probe/build" -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -eq 0) {
            Write-Host '  RESULT: VS generator IS usable on this runner'
          } else {
            Write-Host '  RESULT: VS generator is NOT usable on this runner (exit ' $LASTEXITCODE ')'
            Write-Host '  -> attribute to runner image / cmake version, not to the provisioning script'
          }
        } else {
          Write-Host "== ninja =="
          (ninja --version 2>&1) | ForEach-Object { Write-Host "  $_" }
        }
        Write-Host '== diagnostic complete (non-fatal) =='

    # ── Shaderc provisioning（§8.9）──────────────────────────────────────────
    # engine/CMakeLists.txt 的 shaderc 激活门用 EXISTS() 求值，且要求 Debug 与
    # Release **同时**就位。这些产物在 shaderc submodule 的 .gitignore 覆盖范围内，
    # 不会随仓库分发 —— fresh checkout 必须先生成，否则 SPIR-V 编译被静默关闭而
    # CI 仍然绿灯（committed suite 在开/关两种状态下结果完全相同，无法察觉）。
    #
    # 按各平台自身配置生成：Windows 逐配置匹配 CRT（Debug=/MDd、其它=/MD），
    # 与消费侧根 CMakeLists.txt 的 CMAKE_MSVC_RUNTIME_LIBRARY 一致；Linux 不套用
    # Windows 的 CRT 概念。**不得**在此单值强制 CMAKE_MSVC_RUNTIME_LIBRARY ——
    # 那正是 sandbox/SpirVTest 报 LNK2038 的原因。
    - name: Cache shaderc artifacts
      uses: actions/cache@v4
      with:
        path: third_party/shaderc/build
        key: shaderc-${{ runner.os }}-${{ matrix.c_compiler }}-${{ hashFiles('tools/build_shaderc_ci.ps1', 'third_party/shaderc/CMakeLists.txt') }}
        restore-keys: |
          shaderc-${{ runner.os }}-${{ matrix.c_compiler }}-

    - name: Provision shaderc artifacts (SPIR-V activation)
      shell: pwsh
      run: pwsh -NoProfile -File tools/build_shaderc_ci.ps1

    # B5-RD：RelWithDebInfo+ASan 需要 /MD + ASan 的 shaderc 产物。
    # 该产物位于 git submodule 内，并被其 .gitignore 的 `build-*/` 覆盖，
    # 因此不会随仓库分发 —— fresh checkout 必须先生成。否则 RelWithDebInfo 会
    # 回退到非 ASan 的 Release shaderc，sandbox/SpirVTest 链接报 LNK2038。
    # 放在主 configure 之前：shaderc_wrapper 的映射在 configure 期用 EXISTS() 求值。
    - name: Build ASan RelWithDebInfo shaderc artifact
      if: runner.os == 'Windows' && matrix.enable_asan == 'ON'
      shell: pwsh
      run: pwsh -NoProfile -File tools/build_shaderc_asan_rwd.ps1 -SkipReconfigure

    # REQUIRE_SHADERC=ON：artifact 缺失时**硬失败**，杜绝静默降级后仍绿灯。
    # 缺省（本地开发）保持 OFF + WARNING，不改变既有本地行为。
    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DENABLE_TESTS=ON
        -DENABLE_ASAN=${{ matrix.enable_asan }}
        -DREQUIRE_SHADERC=ON
        -Wno-dev
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # 可审计的启用证据（§8.9）：确认 SPIR-V 路径**确实**参与构建，而不是仅
    # 因 artifact 缺失而降级。三项都通过才允许后续 Test 步骤给出绿灯。
    - name: Verify SPIR-V activation
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $log = "${{ steps.strings.outputs.build-output-dir }}/CMakeFiles/CMakeOutput.log"
        if (-not (Test-Path $log)) { $log = "${{ steps.strings.outputs.build-output-dir }}/CMakeCache.txt" }

        # 1) configure 必须记录 activation 为 ENABLED
        $cache = Get-Content "${{ steps.strings.outputs.build-output-dir }}/CMakeCache.txt" -Raw
        if ($cache -notmatch 'REQUIRE_SHADERC:BOOL=ON') {
          throw 'REQUIRE_SHADERC is not ON in the cache; the activation guard was bypassed.'
        }
        Write-Host 'OK  REQUIRE_SHADERC=ON recorded in cache'

        # 2) shaderc artifact 必须存在且非空
        $libDir = "${{ github.workspace }}/third_party/shaderc/build/libshaderc"
        $wanted = if ("${{ runner.os }}" -eq 'Windows') {
          @('Debug/shaderc_combined.lib', 'Release/shaderc_combined.lib')
        } else {
          @('Debug/libshaderc_combined.a', 'Release/libshaderc_combined.a')
        }
        foreach ($rel in $wanted) {
          $p = Join-Path $libDir $rel
          if (-not (Test-Path $p)) { throw "missing shaderc artifact: $p" }
          if ((Get-Item $p).Length -le 0) { throw "empty shaderc artifact: $p" }
          Write-Host ("OK  {0,-30} {1:N1} MB" -f $rel, ((Get-Item $p).Length / 1MB))
        }

        # 3) SpirVTest 必须在该配置下真正完成一次 GLSL→SPIR-V 编译并反射成功。
        #    这是「SPIR-V 路径实际参与」的运行时证据，而不只是链接成功。
        #    产物名按平台不同：Windows 为 SpirVTest.exe，其余为 SpirVTest。
        $spirvDir = "${{ steps.strings.outputs.build-output-dir }}/sandbox/SpirVTest"
        $spirv = Get-ChildItem -Path $spirvDir -Recurse -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -eq 'SpirVTest.exe' -or $_.Name -eq 'SpirVTest' } |
                 Select-Object -First 1
        if (-not $spirv) { throw "SpirVTest executable was not produced under $spirvDir" }
        Write-Host "OK  SpirVTest: $($spirv.FullName)"
        & $spirv.FullName
        if ($LASTEXITCODE -ne 0) { throw "SpirVTest failed with exit $LASTEXITCODE" }
        Write-Host 'OK  SPIR-V compile + reflection verified at runtime'

    # 基础验证面 = 全量 target + 全量 CTest。
    # HRC 专项证据通过下方 receipt 上传识别，但**不替代**基础面：
    # 若在此收窄 target/test 列表，仓库内已关闭的测试面（如 test_io / test_audio）
    # 在 CI 层面等于不存在。
    - name: Test (full suite)
      shell: bash
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        # --output-on-failure：失败时必须能看到用例自身的输出。否则 test_renderer
        # 之类的失败在日志里只有一行 ***Failed，无法区分是断言失败、SKIP 还是
        # 段错误，等于没有诊断信息。
        #
        # GPU_SKINNING_NO_GL46=1：显式声明本 runner 提供不了 GL 4.6 上下文。
        # 证据由 gl-capability-probe job 持续采集，已实测：llvmpipe 最高 4.5 core
        # （4.6 CREATE FAILED），Zink+lavapipe 亦无法初始化
        # （ZINK: failed to choose pdev）。引擎要求 4.6，因此 4 个
        # GPUSkinningPixelTest 用例在此声明下**显式 SKIP**，而不是伪装通过。
        # 这不是把门禁放宽：不设该变量时拿不到上下文依旧失败，只有 runner 自己
        # 声明无 4.6 能力时才 skip。要真正验证这些像素，仍需 4.6 能力的机器。
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 XDG_SESSION_TYPE=x11 GPU_SKINNING_NO_GL46=1 \
            ctest --build-config ${{ matrix.build_type }} --output-on-failure
        else
          ctest --build-config ${{ matrix.build_type }} --output-on-failure
        fi

    # ctest 只在失败时打印用例输出，而 SKIP 计入 Passed。因此上面一行
    # "test_renderer ... Passed" **不能**被读成 GPU 像素已验证。此处单独重跑
    # GPU 蒙皮用例并把 SKIP 原因打进日志，让"没验证"这件事在 CI 上显式可见，
    # 而不是藏在一个绿色对勾后面。
    - name: Report GPU skinning verification status
      # 必须 always()：套件红的时候恰恰最需要知道 GPU 像素到底验没验，
      # 若跟随前置步骤失败而被跳过，这条证据就永远丢了。
      if: always()
      shell: bash
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        BIN=tests/test_renderer
        if [[ ! -x "$BIN" ]]; then
          echo "GPU-SKINNING-STATUS: $BIN not found; nothing was verified"
          exit 0
        fi
        FILTER='GPUSkinningPixelTest.*'
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          out=$(xvfb-run -a -s "-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 XDG_SESSION_TYPE=x11 GPU_SKINNING_NO_GL46=1 \
            "$BIN" --gtest_filter="$FILTER" 2>&1) || true
        else
          out=$("$BIN" --gtest_filter="$FILTER" 2>&1) || true
        fi
        echo "$out" | grep -E '\[  SKIPPED \]|\[       OK \]|\[  FAILED  \]|DID NOT RUN|tests? from' || true
        if grep -q 'DID NOT RUN' <<<"$out"; then
          echo "GPU-SKINNING-STATUS: NOT VERIFIED on this runner (explicit skip above)."
          echo "GPU-SKINNING-STATUS: pixel verification requires a GL 4.6 capable machine."
        elif grep -q '\[  FAILED  \]' <<<"$out"; then
          echo "GPU-SKINNING-STATUS: FAILED (see output above)."
          exit 1
        else
          echo "GPU-SKINNING-STATUS: ran for real on this runner."
        fi

    - name: Upload HRC test receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: HRC-Receipt-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.sha }}
        path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/LastTest.log
        if-no-files-found: warn

    # ═══════════════════════════════════════════════════════════════
    # 打包构建产物：收集可执行文件 + 依赖资源
    # ═══════════════════════════════════════════════════════════════
    - name: Package Artifacts (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # 收集的 sandbox 应用（主入口）
        APPS=("Sandbox" "EditorDemo")
        
        # 创建打包目录
        PKG_DIR="${{ github.workspace }}/pkg/Sandbox"
        mkdir -p "$PKG_DIR/assets"

        # 复制资产目录
        cp -r "${{ github.workspace }}/assets"/* "$PKG_DIR/assets/" 2>/dev/null || true

        # 复制可执行文件（MSVC 多配置生成器输出在 Release/ 子目录）
        BIN_DIR="${{ steps.strings.outputs.build-output-dir }}/sandbox"
        for app in "${APPS[@]}"; do
          exe="$BIN_DIR/${app}/Release/${app}.exe"
          if [ -f "$exe" ]; then
            cp "$exe" "$PKG_DIR/"
          fi
        done

        # 复制 OpenAL32.dll（在 build/bin/Release/ 下）
        OPENAL_DIR="${{ steps.strings.outputs.build-output-dir }}/bin/Release"
        if [ -f "$OPENAL_DIR/OpenAL32.dll" ]; then
          cp "$OPENAL_DIR/OpenAL32.dll" "$PKG_DIR/"
        elif [ -f "$OPENAL_DIR/soft_oal.dll" ]; then
          cp "$OPENAL_DIR/soft_oal.dll" "$PKG_DIR/OpenAL32.dll"
        fi

        # 复制 VC++ 运行时 DLL（可选，目标机可能没有安装 VC++ Redist）
        # 通常 GitHub Actions 的 windows-latest 会带，但为保险可拷贝
        # 实际发布时建议使用静态链接或附带 redist 安装包

        # 打包为 ZIP（Windows 使用 7z 代替 zip）
        cd "${{ github.workspace }}/pkg"
        7z a "Sandbox-windows-x64.zip" "Sandbox/"
        echo "PACKAGE_PATH=${{ github.workspace }}/pkg/Sandbox-windows-x64.zip" >> "$GITHUB_ENV"

    - name: Package Artifacts (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # 收集的 sandbox 应用
        APPS=("Sandbox" "EditorDemo")

        PKG_DIR="${{ github.workspace }}/pkg/Sandbox"
        mkdir -p "$PKG_DIR/assets"

        # 复制资产目录
        cp -r "${{ github.workspace }}/assets"/* "$PKG_DIR/assets/" 2>/dev/null || true

        # 复制可执行文件
        BIN_DIR="${{ steps.strings.outputs.build-output-dir }}/sandbox"
        for app in "${APPS[@]}"; do
          exe="$BIN_DIR/${app}/${app}"
          if [ -f "$exe" ]; then
            cp "$exe" "$PKG_DIR/"
            chmod +x "$PKG_DIR/${app}"
          fi
        done

        # 打包为 tar.gz
        cd "${{ github.workspace }}/pkg"
        tar -czf "Sandbox-linux-x64.tar.gz" "Sandbox/"
        echo "PACKAGE_PATH=${{ github.workspace }}/pkg/Sandbox-linux-x64.tar.gz" >> "$GITHUB_ENV"

    # ═══════════════════════════════════════════════════════════════
    # 上传构建产物作为 workflow artifact
    # ═══════════════════════════════════════════════════════════════
    - name: Upload as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sandbox-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.sha }}
        path: ${{ env.PACKAGE_PATH }}
        if-no-files-found: warn

  # OpenGL capability probe.
  #
  # Deciding whether a Linux runner can host the GPU pixel verification needs
  # measurement, not a version claim: a Mesa feature list is not evidence that a
  # given context request succeeds on a given runner. This job compiles only
  # GLFW and the system loader, so it produces evidence even while the engine
  # build is blocked on Linux by the unrelated RHI portability defect. It works
  # around nothing: it simply does not depend on that defect, and it changes no
  # existing build or test gate.
  #
  # Two facts are recorded separately and must not be conflated: what a default
  # context reports, and whether explicit 4.5 / 4.6 core contexts can be
  # created. Only the second settles the question, because the production render
  # window requests 4.6 core while the engine's highest real call requirement
  # (DSA entry points on the buffer path) is 4.5.
  #
  # Results are reported rather than asserted, so "this runner cannot provide
  # GL" is a usable answer rather than a failed job. Dispatch-only, so pushing
  # to master does not gain any new CI time.
  gl-capability-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW, Xvfb and the software Vulkan stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libglfw3-dev xvfb mesa-utils \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: Record the Mesa and Vulkan stack actually installed
        run: |
          echo "Mesa packages:"
          dpkg -l | grep -Ei 'mesa|libgl1-mesa' | awk '{print "  " $2, $3}'
          echo "Vulkan ICDs:"
          ls -1 /usr/share/vulkan/icd.d/ 2>&1 | sed 's/^/  /'
          echo "Mesa DRI drivers:"
          ls -1 /usr/lib/x86_64-linux-gnu/dri/ 2>&1 | sed 's/^/  /'

      - name: Build the probe
        run: |
          g++ -std=c++17 -O1 tools/gl_capability_probe.cpp -o "$RUNNER_TEMP/glprobe" \
            $(pkg-config --cflags --libs glfw3)

      - name: Probe under Xvfb with Mesa llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe XDG_SESSION_TYPE=x11 \
            "$RUNNER_TEMP/glprobe" 2>&1 | tee "$RUNNER_TEMP/probe-llvmpipe.txt"

      - name: Probe under Xvfb with default driver selection
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 XDG_SESSION_TYPE=x11 \
            "$RUNNER_TEMP/glprobe" 2>&1 | tee "$RUNNER_TEMP/probe-default.txt"

      # 引擎要求 OpenGL 4.6，而 llvmpipe 最高只给 4.5。Zink 是 Mesa 的
      # OpenGL-on-Vulkan 驱动，跑在 lavapipe（软件 Vulkan）之上时可以提供
      # 真正的 4.6 core 上下文，从而让 GPU 像素用例在无 GPU 的 runner 上
      # 真正跑起来。此处只做**取证**：记录两个驱动栈分别能给到什么版本，
      # 不改任何门禁、不改引擎、不改测试。
      - name: Confirm lavapipe is a usable Vulkan device
        run: |
          {
            echo "=== vulkan loader present? ==="
            ldconfig -p | grep -i vulkan || echo "  (no libvulkan in ldconfig)"
            echo "=== lvp ICD contents ==="
            ls -1 /usr/share/vulkan/icd.d/lvp_icd*.json 2>&1 | while read -r f; do
              echo "  $f"; cat "$f"; done
            echo "=== lavapipe shared object present? ==="
            ls -1 /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so 2>&1 | sed 's/^/  /'
            echo "=== vulkaninfo --summary ==="
            vulkaninfo --summary 2>&1 || echo "  (vulkaninfo failed rc=$?)"
          } | tee "$RUNNER_TEMP/vulkaninfo.txt"

      - name: Probe under Xvfb with Zink and no ICD restriction
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env MESA_LOADER_DRIVER_OVERRIDE=zink \
                XDG_SESSION_TYPE=x11 \
            "$RUNNER_TEMP/glprobe" 2>&1 | tee "$RUNNER_TEMP/probe-zink-defaulticd.txt"

      - name: Probe under Xvfb with Zink on lavapipe
        run: |
          LAVAPIPE_ICD="$(ls -1 /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
          echo "lavapipe ICD = ${LAVAPIPE_ICD:-<not found>}"
          if [[ -z "$LAVAPIPE_ICD" ]]; then
            echo "lavapipe ICD not found; Zink cannot be exercised" \
              | tee "$RUNNER_TEMP/probe-zink-lavapipe.txt"
            exit 0
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env MESA_LOADER_DRIVER_OVERRIDE=zink \
                VK_DRIVER_FILES="$LAVAPIPE_ICD" \
                VK_ICD_FILENAMES="$LAVAPIPE_ICD" \
                LP_NUM_THREADS=4 \
                XDG_SESSION_TYPE=x11 \
            "$RUNNER_TEMP/glprobe" 2>&1 | tee "$RUNNER_TEMP/probe-zink-lavapipe.txt"

      - name: Probe under Xvfb with Zink and LIBGL_KOPPER_DRI2
        run: |
          LAVAPIPE_ICD="$(ls -1 /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
          if [[ -z "$LAVAPIPE_ICD" ]]; then
            echo "lavapipe ICD not found; skipping kopper variant" \
              | tee "$RUNNER_TEMP/probe-zink-kopper.txt"
            exit 0
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env MESA_LOADER_DRIVER_OVERRIDE=zink \
                LIBGL_KOPPER_DRI2=1 \
                VK_DRIVER_FILES="$LAVAPIPE_ICD" \
                VK_ICD_FILENAMES="$LAVAPIPE_ICD" \
                XDG_SESSION_TYPE=x11 \
            "$RUNNER_TEMP/glprobe" 2>&1 | tee "$RUNNER_TEMP/probe-zink-kopper.txt"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GL-capability-probe-${{ github.sha }}
          path: ${{ runner.temp }}/probe-*.txt

  # ── RenderTest 链接失败取证 ──
  #
  # 独立 job，不在 build 矩阵内：RenderTest 链接失败时 build job 会中止，
  # 而本 job 必须仍能采集证据。已知失败现象：
  #   undefined reference to `typeinfo for JPH::DebugRenderer`
  # GitHub 展示日志会截断该行、丢失引用者 object 文件名，故此处采集原始证据。
  #
  # 本 job 只读取构建产物并运行 nm / make，不修改任何源码、宏、Jolt 选项或
  # 构建门禁；不触发 main 工作流的 dispatch。
  jolt-link-diagnose:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libwayland-dev wayland-protocols \
            libxkbcommon-dev xvfb pkg-config

      - name: Configure and build until RenderTest
        id: build
        continue-on-error: true
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON -DENABLE_ASAN=OFF \
            -Wno-dev -S "${{ github.workspace }}" > cfg.log 2>&1 \
            || { echo "=== CONFIGURE FAILED ==="; tail -30 cfg.log; exit 1; }
          cmake --build build -j2 > build.log 2>&1 || true
          echo "--- last 30 lines of build output ---"
          tail -30 build.log
          grep -n 'undefined reference' build.log || echo "no undefined reference found"

      - name: Collect link and symbol evidence
        if: always()
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/jolt-evidence"
          mkdir -p "$OUT"
          cd build || exit 0

          echo "===== 1. RenderTest link command ====="
          f=$(find . -path '*RenderTest.dir/link.txt' | head -1)
          if [ -n "$f" ]; then cat "$f" | tee "$OUT/rendertest_link.txt"; else echo "link.txt NOT FOUND"; fi

          echo "===== 2. JPH_DEBUG_RENDERER actual macro state ====="
          for t in RenderTest EngineCore Jolt; do
            f=$(find . -path "*${t}.dir/flags.make" | head -1)
            echo "--- $t ($f) ---"
            if [ -n "$f" ]; then grep -E '^CXX_DEFINES' "$f" | tee -a "$OUT/macros.txt"; else echo "flags.make NOT FOUND for $t"; fi
          done

          echo "===== 3. does Jolt DebugRenderer.cpp.o define the typeinfo? ====="
          o=$(find . -name 'DebugRenderer.cpp.o' | head -1)
          echo "object: ${o:-<not built>}"
          if [ -n "$o" ]; then
            nm -C "$o" > "$OUT/jolt_dr_nm.txt" 2>&1
            grep -E 'typeinfo for JPH::DebugRenderer|vtable for JPH::DebugRenderer' "$OUT/jolt_dr_nm.txt" \
              || echo "  -> NO typeinfo/vtable for JPH::DebugRenderer in this object"
          fi

          echo "===== 4. WHO requires the undefined typeinfo? ====="
          found=0
          for o in $(find . -name '*.o'); do
            if nm -C "$o" 2>/dev/null | grep -q 'U .*typeinfo for JPH::DebugRenderer'; then
              echo "  REFERENCES IT: $o"
              nm -C "$o" 2>/dev/null | grep 'typeinfo for JPH::DebugRenderer' | sed 's/^/      /'
              found=1
            fi
          done
          [ "$found" -eq 0 ] && echo "  -> no object carries the undefined reference"

          echo "===== 5. does libJolt.a carry it? ====="
          la=$(find . -name 'libJolt.a' | head -1)
          echo "archive: ${la:-<not found>}"
          if [ -n "$la" ]; then
            nm -C "$la" 2>/dev/null | grep -E 'typeinfo for JPH::DebugRenderer' | head -5 | tee "$OUT/libjolt_nm.txt" \
              || echo "  -> libJolt.a has NO typeinfo for JPH::DebugRenderer"
          fi

          echo "===== 6. engine JoltDebugRenderer.cpp.o ====="
          o2=$(find . -path '*EngineCore.dir*' -name 'JoltDebugRenderer.cpp.o' | head -1)
          echo "object: ${o2:-<not built>}"
          if [ -n "$o2" ]; then
            nm -C "$o2" 2>&1 | grep -E 'typeinfo for JPH::DebugRenderer|typeinfo for Engine::JoltDebugRenderer' \
              || echo "  -> no JPH::DebugRenderer typeinfo here"
          fi

          cd "$RUNNER_TEMP" || exit 0
          tar czf jolt-evidence.tar.gz jolt-evidence 2>/dev/null
          echo "===== archive contents ====="
          tar tzf jolt-evidence.tar.gz

      - name: Upload Jolt link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jolt-link-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/jolt-evidence.tar.gz
          if-no-files-found: warn